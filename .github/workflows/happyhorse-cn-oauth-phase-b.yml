name: HappyHorse CN OAuth Phase B

on:
  push:
    branches:
      - implementation/global-production-v2
    paths:
      - 'runtime-auth/HAPPYHORSE_OAUTH_COMPLETE'

permissions:
  contents: write

jobs:
  complete-oauth:
    runs-on: ubuntu-24.04
    env:
      HAPPYHORSE_OAUTH_CALLBACK_URL: ${{ secrets.HAPPYHORSE_OAUTH_CALLBACK_URL }}
      AGE_RUNTIME_AUTH_PRIVATE_KEY: ${{ secrets.AGE_RUNTIME_AUTH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/global-production-v2

      - name: Fail closed on required secret inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HAPPYHORSE_OAUTH_CALLBACK_URL:-}"
          test -n "${AGE_RUNTIME_AUTH_PRIVATE_KEY:-}"
          test -s runtime-auth/happyhorse-oauth-transaction.v1.age
          test -s runtime-auth/runtime-auth.v1.age

      - name: Install pinned age v1.3.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo age.tar.gz https://github.com/FiloSottile/age/releases/download/v1.3.1/age-v1.3.1-linux-amd64.tar.gz
          echo 'bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377  age.tar.gz' | sha256sum -c -
          tar -xzf age.tar.gz
          echo "$PWD/age" >> "$GITHUB_PATH"

      - name: Decrypt transaction state and verify Age identity binding
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$AGE_RUNTIME_AUTH_PRIVATE_KEY" > .age-runtime-auth-identity
          chmod 0600 .age-runtime-auth-identity
          DERIVED_RECIPIENT="$(age-keygen -y .age-runtime-auth-identity)"
          TRACKED_RECIPIENT="$(tr -d '\r\n' < runtime-auth/runtime-auth-public-key.txt)"
          test "$DERIVED_RECIPIENT" = "$TRACKED_RECIPIENT"
          age --decrypt --identity .age-runtime-auth-identity --output .happyhorse-oauth-state.json runtime-auth/happyhorse-oauth-transaction.v1.age
          chmod 0600 .happyhorse-oauth-state.json

      - name: Exchange authorization code and verify membership without generation
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node <<'NODE'
          const fs = require('node:fs');

          const fail = (msg, details={}) => {
            console.error(JSON.stringify({status:'BLOCK', reason:msg, ...details}));
            process.exit(1);
          };
          const state = JSON.parse(fs.readFileSync('.happyhorse-oauth-state.json', 'utf8'));
          if (state?.schema_version !== 1 || state?.appId !== 'aorizon_cn' || state?.cli_emulation_version !== '0.1.9') fail('transaction_state_invalid');
          if (typeof state.deviceId !== 'string' || !state.deviceId || typeof state.codeVerifier !== 'string' || state.codeVerifier.length !== 43) fail('transaction_state_incomplete');

          let cb;
          try { cb = new URL(process.env.HAPPYHORSE_OAUTH_CALLBACK_URL); }
          catch { fail('callback_url_invalid'); }
          if (cb.protocol !== 'http:' || cb.hostname !== '127.0.0.1' || cb.port !== '33897' || cb.pathname !== '/callback') fail('callback_route_mismatch');
          const codes = cb.searchParams.getAll('code');
          if (codes.length !== 1 || !codes[0].trim()) fail('callback_code_missing');
          const authorizationCode = codes[0].trim();

          const commonHeaders = {
            'User-Agent': 'happyhorse-cli/0.1.9',
            'X-App-Id': 'aorizon_cn',
            'X-Language': 'zh-CN',
            'X-Client-Type': 'cli',
            'X-Client-Version': '0.1.9',
            'X-Client-Command': 'login'
          };

          (async () => {
            const tokenRes = await fetch('https://api-gateway.aorizon.com/api/v1/auth/cli/token', {
              method: 'POST',
              headers: {...commonHeaders, 'Content-Type': 'application/json'},
              body: JSON.stringify({
                authorizationCode,
                codeVerifier: state.codeVerifier,
                deviceId: state.deviceId,
                deviceName: 'HappyHorse CLI (linux-x64)',
                appVersion: '0.1.9'
              })
            });
            let tokenBody;
            try { tokenBody = await tokenRes.json(); }
            catch { fail('token_exchange_non_json', {http_status: tokenRes.status}); }
            if (!tokenRes.ok || tokenBody?.success !== true) {
              fail('token_exchange_rejected', {
                http_status: tokenRes.status,
                error_code: tokenBody?.errorCode ?? null,
                trace_id: tokenBody?.traceId ?? null
              });
            }
            const d = tokenBody?.data;
            if (!d || typeof d.accessToken !== 'string' || !d.accessToken || typeof d.refreshToken !== 'string' || !d.refreshToken || !(Number(d.accessExpiresIn) > 0) || !(Number(d.refreshExpiresIn) > 0)) fail('token_exchange_success_shape_invalid');
            const now = Date.now();
            const session = {
              appId: 'aorizon_cn',
              deviceId: state.deviceId,
              accessToken: d.accessToken,
              refreshToken: d.refreshToken,
              accessExpiresAt: now + Number(d.accessExpiresIn) * 1000,
              refreshExpiresAt: now + Number(d.refreshExpiresIn) * 1000
            };

            const membershipRes = await fetch('https://api-gateway.aorizon.com/api/v1/cli/membership/status', {
              method: 'GET',
              headers: {
                ...commonHeaders,
                'X-Device-Id': state.deviceId,
                'Authorization': `Bearer ${d.accessToken}`
              }
            });
            let membershipBody = null;
            try { membershipBody = await membershipRes.json(); } catch {}
            if (!membershipRes.ok || membershipBody?.success === false) {
              fail('membership_rejected', {
                http_status: membershipRes.status,
                error_code: membershipBody?.errorCode ?? null,
                trace_id: membershipBody?.traceId ?? null
              });
            }

            fs.writeFileSync('.happyhorse-session-source.json', JSON.stringify(session) + '\n', {mode: 0o600});
            fs.writeFileSync('runtime-auth/HAPPYHORSE_OAUTH_BIND_RESULT.json', JSON.stringify({
              schema_version: 1,
              status: 'PASS',
              provider: 'happyhorse_cn',
              app_id: 'aorizon_cn',
              callback_port: 33897,
              token_exchange_http_status: tokenRes.status,
              membership_http_status: membershipRes.status,
              authenticated_session_valid: true,
              canonical_session_field_count: 6,
              cli_executed: false,
              project_created: false,
              task_created: false,
              video_generation: false,
              credits_consumed: false,
              completed_at: new Date().toISOString()
            }, null, 2) + '\n');
          })().catch(err => fail('unexpected_exchange_error', {name: err?.name || 'Error'}));
          NODE

      - name: Atomically replace only HappyHorse session in canonical encrypted runtime auth
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/video-production/src"
          python3 video-production/src/encrypted_runtime_auth.py decrypt-materialize \
            --identity-file .age-runtime-auth-identity \
            --encrypted runtime-auth/runtime-auth.v1.age
          python3 - <<'PY'
          from pathlib import Path
          from runtime_auth import persist_happyhorse_session_from_path
          if not persist_happyhorse_session_from_path(Path('.happyhorse-session-source.json')):
              raise SystemExit('HappyHorse session replacement failed')
          PY
          RECIPIENT="$(tr -d '\r\n' < runtime-auth/runtime-auth-public-key.txt)"
          python3 video-production/src/encrypted_runtime_auth.py reencrypt-materialized \
            --recipient "$RECIPIENT" \
            --output runtime-auth/runtime-auth.v1.age

      - name: No-generation canonical runtime preflight
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/video-production/src"
          rm -rf .runtime-auth
          python3 video-production/src/provider_runtime_preflight.py \
            --encrypted-auth runtime-auth/runtime-auth.v1.age \
            --age-identity-file .age-runtime-auth-identity \
            --result runtime-auth/happyhorse-oauth-runtime-preflight.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('runtime-auth/happyhorse-oauth-runtime-preflight.json').read_text())
          assert r['provider_runtime_preflight_ready'] is True
          assert r['encrypted_runtime_auth_loaded'] is True
          assert r['run_id_created'] is False
          assert r['provider_generation_call_executed'] is False
          assert r['credits_consumed'] is False
          assert r['secret_value_exposed'] is False
          PY

      - name: Clean all plaintext auth material
        shell: bash
        run: |
          set -euo pipefail
          rm -f .happyhorse-oauth-state.json .happyhorse-session-source.json .age-runtime-auth-identity age.tar.gz
          rm -rf .runtime-auth age
          test ! -e .happyhorse-oauth-state.json
          test ! -e .happyhorse-session-source.json
          test ! -e .age-runtime-auth-identity
          test -z "$(git ls-files .runtime-auth .happyhorse-oauth-state.json .happyhorse-session-source.json .age-runtime-auth-identity)"

      - name: Commit canonical ciphertext only and consume transaction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f runtime-auth/happyhorse-oauth-transaction.v1.age runtime-auth/HAPPYHORSE_OAUTH_PENDING.json
          git add runtime-auth/runtime-auth.v1.age runtime-auth/HAPPYHORSE_OAUTH_BIND_RESULT.json runtime-auth/happyhorse-oauth-runtime-preflight.json
          git diff --cached --quiet && exit 1 || true
          git commit -m 'bind refreshed HappyHorse CN OAuth session'
          git push origin HEAD:implementation/global-production-v2
