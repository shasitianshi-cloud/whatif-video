name: V2 Canonical Recovery Bridge

on:
  push:
    branches:
      - migration/whatif-recovery-v2-clean-v1
    paths:
      - READY

permissions:
  contents: write

jobs:
  recover:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/whatif-recovery-v2-clean-v1
          fetch-depth: 0

      - name: Reassemble and verify canonical recovery payload
        shell: bash
        env:
          EXPECTED_TAR_SHA256: b668b7de4c497804d9e07ad24a294c8d6796ce15f321553d2b39c6f47e1b454d
          EXPECTED_FILE_COUNT: '74'
        run: |
          set -euo pipefail
          test -f READY
          test -f part-00.b64
          test -f v2-canonical-manifest.json
          mkdir -p .recovery-stage
          base64 -d part-00.b64 > .recovery-stage/v2-canonical-source.tar.gz
          echo "$EXPECTED_TAR_SHA256  .recovery-stage/v2-canonical-source.tar.gz" | sha256sum -c -
          python3 - <<'PY'
          import hashlib, json, pathlib, tarfile
          stage = pathlib.Path('.recovery-stage')
          extract = stage / 'extract'
          extract.mkdir(parents=True, exist_ok=True)
          archive = stage / 'v2-canonical-source.tar.gz'
          root = extract.resolve()
          with tarfile.open(archive, 'r:gz') as tf:
              members = [m for m in tf.getmembers() if m.isfile()]
              if len(members) != 74:
                  raise SystemExit(f'file count mismatch: {len(members)}')
              for m in tf.getmembers():
                  target = (root / m.name).resolve()
                  if root not in target.parents and target != root:
                      raise SystemExit(f'unsafe path: {m.name}')
                  if m.issym() or m.islnk():
                      raise SystemExit(f'links forbidden: {m.name}')
              tf.extractall(extract)
          manifest = json.loads(pathlib.Path('v2-canonical-manifest.json').read_text())
          entries = manifest.get('files') or manifest.get('entries') or manifest.get('canonical_files')
          if not isinstance(entries, list) or len(entries) != 74:
              raise SystemExit('manifest entry count mismatch')
          for e in entries:
              rel = e.get('path') or e.get('relative_path')
              size = e.get('size_bytes') if 'size_bytes' in e else e.get('size')
              sha = e.get('sha256')
              if not rel or sha is None or size is None:
                  raise SystemExit('manifest entry missing required fields')
              p = extract / rel
              if not p.is_file():
                  raise SystemExit(f'missing: {rel}')
              data = p.read_bytes()
              if len(data) != int(size):
                  raise SystemExit(f'size mismatch: {rel}')
              if hashlib.sha256(data).hexdigest() != sha:
                  raise SystemExit(f'sha mismatch: {rel}')
          print('MANIFEST_MATCH=true')
          PY

      - name: Materialize canonical source without touching GitHub-only assets
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .recovery-stage/extract/.github
          cp -a .recovery-stage/extract/. ./
          mkdir -p recovery
          cat > recovery/V2_CANONICAL_SOURCE_RECOVERY_V1.json <<'JSON'
          {
            "status": "PASS",
            "source": "verified root recovery payload",
            "canonical_file_count": 74,
            "manifest_match": true,
            "tar_sha256": "b668b7de4c497804d9e07ad24a294c8d6796ce15f321553d2b39c6f47e1b454d",
            "runtime_secrets_migrated": false,
            "provider_calls": false,
            "production_ready": false
          }
          JSON
          rm -rf recovery/transfer .recovery-stage
          rm -f READY part-00.b64 v2-canonical-manifest.json
          rm -f .github/workflows/v2-canonical-recovery-bridge.yml

      - name: Commit exact V2 canonical source baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "recover exact V2 canonical source baseline"
          git push origin HEAD:migration/whatif-recovery-v2-clean-v1
