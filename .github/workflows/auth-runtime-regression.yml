name: auth-runtime-regression

on:
  push:
    branches:
      - migration/whatif-recovery-v2-clean-v1
    paths:
      - .github/workflows/auth-runtime-regression.yml
      - video-production/src/runtime_auth.py
      - video-production/src/provider_runtime_preflight.py
      - .gitignore
      - runtime-auth-required.json

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Synthetic persistence and reload regression
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/video-production/src"
          export VOLCENGINE_TTS_API_KEY='synthetic-not-a-real-key'
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from runtime_auth import persist_volcengine_from_environment, persist_happyhorse_session_from_path
          assert persist_volcengine_from_environment()
          fixture = Path('synthetic-happyhorse-session.json')
          fixture.write_text(json.dumps({
              'accessToken': 'synthetic-access',
              'refreshToken': 'synthetic-refresh',
              'accessExpiryMs': 4102444800000,
          }), encoding='utf-8')
          assert persist_happyhorse_session_from_path(fixture)
          fixture.unlink()
          PY
          unset VOLCENGINE_TTS_API_KEY
          python3 video-production/src/provider_runtime_preflight.py --result auth-preflight-result.json
          python3 - <<'PY'
          import json, os, stat
          from pathlib import Path
          r=json.loads(Path('auth-preflight-result.json').read_text())
          assert r['provider_runtime_preflight_ready'] is True
          assert r['volcengine_tts_credential_source']=='project_local_runtime_auth'
          assert r['happyhorse_session_present'] is True
          assert r['happyhorse_session_valid'] is True
          assert stat.S_IMODE(Path('.runtime-auth').stat().st_mode)==0o700
          assert stat.S_IMODE(Path('.runtime-auth/volcengine/credential.json').stat().st_mode)==0o600
          assert stat.S_IMODE(Path('.runtime-auth/happyhorse/session.json').stat().st_mode)==0o600
          assert r['provider_generation_call_executed'] is False
          assert r['run_id_created'] is False
          assert r['credits_consumed'] is False
          PY
          git check-ignore -q .runtime-auth/volcengine/credential.json
          ! git status --porcelain | grep -q '.runtime-auth'
          rm -rf .runtime-auth auth-preflight-result.json
