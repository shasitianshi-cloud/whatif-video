name: Render Input Closure Regression

on:
  push:
    branches:
      - migration/whatif-recovery-v2-clean-v1
    paths:
      - 'video-production/schemas/**'
      - 'video-production/src/build_asset_manifest.py'
      - 'video-production/src/build_render_input.py'
      - 'video-production/tests/test_render_input_closure.py'
      - '.github/workflows/render-input-closure-regression.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run recovered render-input closure regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          import json
          import sys
          import tempfile
          from pathlib import Path

          sys.path.insert(0, str(Path('video-production/src').resolve()))
          path = Path('video-production/tests/test_render_input_closure.py')
          spec = importlib.util.spec_from_file_location('render_input_regression', path)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          with tempfile.TemporaryDirectory() as d:
              mod.test_normalization_projection_and_boundaries(Path(d))
          with tempfile.TemporaryDirectory() as d:
              mod.test_missing_multi_asset_timing_blocks(Path(d))
          with tempfile.TemporaryDirectory() as d:
              mod.test_cross_run_and_sha_mismatch_block(Path(d))

          for schema in (
              'video-production/schemas/asset-manifest.schema.json',
              'video-production/schemas/render-input.schema.json',
          ):
              json.load(open(schema, encoding='utf-8'))

          print('RENDER_INPUT_CLOSURE_REGRESSION=PASS')
          print('ASSET_MANIFEST_SCHEMA_JSON_PARSE=PASS')
          print('RENDER_INPUT_SCHEMA_JSON_PARSE=PASS')
          PY
