name: pinned-render-runtime-probe

on:
  push:
    branches:
      - migration/whatif-recovery-v2-clean-v1
    paths:
      - 'video-production/runtime/**'
      - '.github/workflows/pinned-render-runtime-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-render-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24.14.0
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"

      - name: Ensure FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          node --version
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Materialize canonical pinned runtime
        shell: bash
        run: |
          set -euo pipefail
          bash video-production/runtime/materialize-hyperframes-runtime.sh

      - name: Create minimal deterministic composition
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe-composition evidence
          cat > probe-composition/index.html <<'HTML'
          <!doctype html>
          <html>
          <head>
            <meta charset="utf-8" />
            <style>
              html, body { margin: 0; width: 100%; height: 100%; background: #111; overflow: hidden; }
              #stage { position: relative; width: 1280px; height: 720px; background: #111; }
              .clip { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: white; font: 48px sans-serif; }
            </style>
          </head>
          <body>
            <div id="stage" data-composition-id="runtime-probe" data-start="0" data-duration="1" data-width="1280" data-height="720">
              <div class="clip" data-start="0" data-duration="1" data-track-index="0">WHATIF</div>
            </div>
          </body>
          </html>
          HTML

      - name: Real local HyperFrames render through canonical launcher
        shell: bash
        run: |
          set -euo pipefail
          bash video-production/runtime/run-hyperframes-local.sh render \
            -c ./probe-composition/index.html \
            -o ./evidence/runtime-probe.mp4 \
            > ./evidence/hyperframes-render.json
          test -s ./evidence/runtime-probe.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate -show_entries format=duration -of json ./evidence/runtime-probe.mp4 > ./evidence/ffprobe.json
          sha256sum ./evidence/runtime-probe.mp4 > ./evidence/runtime-probe.mp4.sha256

      - name: Verify runtime identity and output
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, subprocess, hashlib
          manifest = json.loads(pathlib.Path('video-production/runtime/hyperframes-runtime-manifest.json').read_text())
          probe = json.loads(pathlib.Path('evidence/ffprobe.json').read_text())
          stream = probe['streams'][0]
          fmt = probe['format']
          mp4 = pathlib.Path('evidence/runtime-probe.mp4')
          assert manifest['hyperframes_version'] == '0.7.106'
          assert manifest['source_commit'] == 'c9dd8413c35d110241293a38a8411a1a719e6176'
          assert manifest['chromium']['version'] == '152.0.7928.2'
          assert manifest['render_json_mode'] is True
          assert manifest['render_json_flag_injected_once'] is True
          assert int(stream['width']) == 1280
          assert int(stream['height']) == 720
          assert mp4.stat().st_size > 0
          print('HYPERFRAMES_LOCAL_RUNTIME_VALID=true')
          print('HYPERFRAMES_RENDER_JSON_MODE=true')
          print('RENDER_JSON_FLAG_INJECTED_ONCE=true')
          print('OUTPUT_VIDEO_CREATED=true')
          print('OUTPUT_VIDEO_READABLE=true')
          print('OUTPUT_VIDEO_SHA256=' + hashlib.sha256(mp4.read_bytes()).hexdigest())
          PY

      - name: Upload pinned render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-render-runtime-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 7
