name: Real V2 Daily Visual Planner 20260812

on:
  push:
    branches:
      - implementation/global-production-v2
    paths:
      - 'recovery/REAL_V2_DAILY_VISUAL_PLANNER_20260812_TRIGGER'

permissions:
  contents: write

jobs:
  visual-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run bounded V2 Visual Planner with frozen host response
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/video-production/src"
          python3 - <<'PY'
          import copy
          import json
          import math
          from pathlib import Path
          from production_visual_planner import run_visual_planner
          from build_asset_dispatch import build_asset_dispatch, validate_asset_dispatch

          RUN_ID='real-v2-daily-20260812-001'
          ROOT=Path.cwd()
          candidate_path=ROOT/'recovery/real-v2-visual-plans'/f'{RUN_ID}.json'
          candidate=json.loads(candidate_path.read_text(encoding='utf-8'))
          manifest=json.loads((ROOT/'runs'/RUN_ID/'video-production/narration/narration-audio-manifest.json').read_text(encoding='utf-8'))
          tts_gate=json.loads((ROOT/'runs'/RUN_ID/'video-production/narration/real-v2-tts-production-gate.json').read_text(encoding='utf-8'))
          assert candidate['run_id']==RUN_ID
          assert manifest['segment_count']==11
          assert tts_gate['status']=='PASS' and tts_gate['segment_count']==11
          assert [x['segment_id'] for x in candidate['segments']] == [x['segment_id'] for x in manifest['segments']]

          calls=0
          def planner_model_call(prompt):
              global calls
              calls += 1
              assert prompt.strip()
              assert 'visual-planning-policy.v2' in prompt
              return copy.deepcopy(candidate)

          gate=run_visual_planner(
              RUN_ID,
              planner_model_call=planner_model_call,
              model_name='GPT-5.6 Sol host-managed',
          )
          assert calls==1
          assert gate['status']=='PASS'
          assert gate['provider_generation_executed'] is False
          assert gate['happyhorse_required_segments']==math.ceil(11*0.40)==5
          assert gate['happyhorse_primary_segments']>=5
          assert gate['first_segment_happyhorse_primary'] is True
          assert gate['first_three_second_hook_contract']=='PASS'
          assert gate['cover_required'] is True
          assert gate['cover_title_exact'] is True

          script=json.loads((ROOT/gate['artifact']).read_text(encoding='utf-8'))
          dispatch=build_asset_dispatch(script)
          validate_asset_dispatch(dispatch)
          hh=[x for x in dispatch['tasks'] if x['generation_route']=='happyhorse']
          images=[x for x in dispatch['tasks'] if x['generation_route']=='gpt-image-2']
          assert len(hh)==5
          assert len(images)==12
          assert len(dispatch['tasks'])==17

          evidence={
              'schema_version':1,
              'run_id':RUN_ID,
              'gate':'REAL_V2_VISUAL_PLANNER_ACCEPTANCE',
              'status':'PASS',
              'narration_segment_count':11,
              'happyhorse_required_segments':gate['happyhorse_required_segments'],
              'happyhorse_primary_segments':gate['happyhorse_primary_segments'],
              'first_segment_happyhorse_primary':gate['first_segment_happyhorse_primary'],
              'first_three_second_hook_contract':gate['first_three_second_hook_contract'],
              'cover_required':gate['cover_required'],
              'cover_title_exact':gate['cover_title_exact'],
              'dispatch_task_count':len(dispatch['tasks']),
              'happyhorse_task_count':len(hh),
              'image_task_count_including_cover':len(images),
              'physical_provider_selected_by_llm':False,
              'provider_generation_executed':False,
              'next_stage':'ASSET_EXECUTION_PREFLIGHT_V2'
          }
          out=ROOT/'runs'/RUN_ID/'video-production/production-script/real-v2-visual-planner-acceptance.json'
          out.write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(evidence,ensure_ascii=False,separators=(',',':')))
          PY

      - name: Commit V2 Production Script and acceptance evidence
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID='real-v2-daily-20260812-001'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "runs/$RUN_ID/video-production/production-script"
          git diff --cached --quiet && { echo 'NO_VISUAL_PLANNER_OUTPUT'; exit 1; }
          git commit -m "accept real V2 visual plan for $RUN_ID"
          git push origin HEAD:implementation/global-production-v2
