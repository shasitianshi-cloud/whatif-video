name: Character Consistency Galgame Outfit V2

on:
  push:
    branches:
      - implementation/global-production-v2
    paths:
      - 'stress-tests/character-consistency-galgame-v2/TRIGGER_001'

permissions:
  contents: write

concurrency:
  group: character-consistency-galgame-outfit-v2
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CONTRACT: stress-tests/character-consistency-galgame-v2/prompt-contract.json
      RUN_ID: character-consistency-galgame-outfit-v2-20260814-001
      AGE_RUNTIME_AUTH_PRIVATE_KEY: ${{ secrets.AGE_RUNTIME_AUTH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/global-production-v2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'

      - name: Build V2 dispatch from isolated contract
        shell: bash
        run: |
          set -euo pipefail
          python3 stress-tests/character-consistency-galgame-v1/build_dispatch.py --contract "$CONTRACT"

      - name: Materialize Volcengine image credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AGE_RUNTIME_AUTH_PRIVATE_KEY:-}"
          umask 077
          printf '%s\n' "$AGE_RUNTIME_AUTH_PRIVATE_KEY" > .age-runtime-auth-identity
          node video-production/runtime/decrypt-volcengine-image-auth.mjs \
            runtime-auth/volcengine-image-runtime-auth.v1.json \
            .age-runtime-auth-identity \
            .runtime-auth/volcengine-image/credential.txt

      - name: Execute six V2 image tasks with repository component
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/video-production/src"
          python3 video-production/src/run_asset_executor.py \
            "runs/$RUN_ID/video-production/execution/asset-dispatch.json" \
            --execute-provider \
            --image-execution-adapter volcengine_general3_t2i_api \
            --image-credential-file .runtime-auth/volcengine-image/credential.txt

      - name: Gate V2 execution
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          run_id=os.environ['RUN_ID']
          root=Path('runs')/run_id/'video-production/execution'
          dispatch=json.loads((root/'asset-dispatch.json').read_text())
          state=json.loads((root/'asset-executor-state.json').read_text())
          assert len(dispatch['tasks'])==6
          assert state['status']=='COMPLETE'
          assert state['next_task_index']==6
          assert state['serial_execution'] is True
          assert state['completeness']['asset_execution_completeness_pass'] is True
          print(json.dumps({'status':'PASS','run_id':run_id,'task_count':6,'serial_execution':True},ensure_ascii=False))
          PY

      - name: Commit V2 image artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "runs/$RUN_ID"
          git diff --cached --quiet && { echo 'NO_V2_TEST_ARTIFACTS'; exit 1; }
          git commit -m "run galgame extreme outfit consistency v2"
          git push origin HEAD:implementation/global-production-v2

      - name: Remove plaintext auth
        if: always()
        shell: bash
        run: rm -rf .runtime-auth .age-runtime-auth-identity
