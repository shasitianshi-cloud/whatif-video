name: Production Script Recovery Regression

on:
  push:
    branches:
      - migration/whatif-recovery-v2-clean-v1
    paths:
      - 'video-production/schemas/production-script.recovery-v1.schema.json'
      - 'video-production/src/validate_production_script.py'
      - 'video-production/tests/test_production_script_recovery.py'
      - '.github/workflows/production-script-recovery-regression.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run standard-library regression
        run: python3 video-production/tests/test_production_script_recovery.py
